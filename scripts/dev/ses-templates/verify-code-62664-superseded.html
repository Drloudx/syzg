<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊大书院 验证码</title>
</head>
<!--
  腾讯云 SES 验证码模板（上传到 控制台 → 发信模板 → 新建 → 模板类型选「HTML 富文本」）

  三条硬约束，改这个文件时别破坏：
    1. **只能用内联 style**，不能引外部 CSS、不能引外链图片
       （官方原文："如果 HTML 不要包含外部文件的 CSS"；外链图片还会被邮箱默认拦截、拖累送达率）
    2. 变量必须写成 {{变量名}} 形式，与发送时的 TemplateData JSON key 一一对应
       —— 这里用了 {{code}} 与 {{minutes}}
    3. **不能出现微信 / QQ / 二维码 / 群号**（官方「允许发送的邮件类型」明确禁止社交类信息），
       所以本模板刻意不放任何图片和联系方式
-->
<body style="margin:0;padding:0;background-color:#efe6d6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#efe6d6;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#dfceb3;border:2px solid #8f7351;border-radius:8px;">
          <tr>
            <td style="padding:22px 26px 6px;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold;color:#3e2a14;">
              深渊大书院
            </td>
          </tr>
          <tr>
            <td style="padding:0 26px 18px;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.7;color:#3e2a14;">
              你正在进行邮箱验证，验证码是：
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 26px 20px;">
              <div style="display:inline-block;padding:12px 26px;background-color:#e9dcc3;border:1px solid #8f7351;border-radius:6px;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:30px;font-weight:bold;letter-spacing:8px;color:#2f4a49;">
                {{code}}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 26px 24px;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.8;color:#6b5134;">
              验证码 {{minutes}} 分钟内有效，请勿转发给他人。<br>
              如非本人操作请忽略。
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
          <tr>
            <td style="padding:12px 8px 0;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#8a6d4d;text-align:center;">
              本邮件由系统自动发送，请勿直接回复。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
